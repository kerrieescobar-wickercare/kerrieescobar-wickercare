<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Classic English 7-Step Caning (Vienna Webbing) Seamless Tile - Warm Honey Rattan -->
  <defs>
    <linearGradient id="strand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C99458" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#B87538" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9C5920" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="diag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A36B" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#B87538" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#8E4E18" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Vertical Cane Strands -->
  <line x1="12" y1="0" x2="12" y2="60" stroke="url(#strand)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="0" x2="18" y2="60" stroke="url(#strand)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="0" x2="42" y2="60" stroke="url(#strand)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="0" x2="48" y2="60" stroke="url(#strand)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Horizontal Cane Strands -->
  <line x1="0" y1="12" x2="60" y2="12" stroke="url(#strand)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="18" x2="60" y2="18" stroke="url(#strand)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="42" x2="60" y2="42" stroke="url(#strand)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="0" y1="48" x2="60" y2="48" stroke="url(#strand)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Diagonal Strands (Top-Left to Bottom-Right) -->
  <line x1="-15" y1="15" x2="45" y2="75" stroke="url(#diag)" stroke-width="2"/>
  <line x1="15" y1="-15" x2="75" y2="45" stroke="url(#diag)" stroke-width="2"/>
  <line x1="-15" y1="-15" x2="75" y2="75" stroke="url(#diag)" stroke-width="2.2"/>

  <!-- Diagonal Strands (Top-Right to Bottom-Left) -->
  <line x1="75" y1="15" x2="15" y2="75" stroke="url(#diag)" stroke-width="2"/>
  <line x1="45" y1="-15" x2="-15" y2="45" stroke="url(#diag)" stroke-width="2"/>
  <line x1="75" y1="-15" x2="-15" y2="75" stroke="url(#diag)" stroke-width="2.2"/>

  <!-- Octagon Weave Nodes with honey amber glow -->
  <circle cx="15" cy="15" r="2" fill="#B87538" fill-opacity="0.65"/>
  <circle cx="45" cy="15" r="2" fill="#B87538" fill-opacity="0.65"/>
  <circle cx="15" cy="45" r="2" fill="#B87538" fill-opacity="0.65"/>
  <circle cx="45" cy="45" r="2" fill="#B87538" fill-opacity="0.65"/>
</svg>
